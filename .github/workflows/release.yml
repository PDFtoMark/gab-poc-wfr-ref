name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_run:
    workflows: ["Prepare Release"]
    types: [completed]
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: context
        run: |
          echo "REF=${{ github.ref }}"
          echo "SHA=${{ github.sha }}"
          echo "REF_NAME=${{ github.ref_name }}"
          echo "EVENT_NAME=${{ github.event_name }}"
          echo "UPSTREAM_HEAD_BRANCH=${{ github.event.workflow_run.head_branch }}"
          echo "UPSTREAM_HEAD_SHA=${{ github.event.workflow_run.head_sha }}"
          echo "UPSTREAM_EVENT=${{ github.event.workflow_run.event }}"
          echo "UPSTREAM_NAME=${{ github.event.workflow_run.name }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: what was checked out
        run: |
          git log -1 --format='%H %s'
          echo "--- marker (main has MAIN, PR had ATTACKER) ---"
          cat marker.txt || echo "no marker on main"
